name: corrosion-detection

services:
  db:
    image: postgres:16-alpine
    container_name: corrosion_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-corrosion_db}
      POSTGRES_USER: ${POSTGRES_USER:-corrosion_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Переменная POSTGRES_PASSWORD должна быть установлена в .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corrosion_user} -d ${POSTGRES_DB:-corrosion_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  ml:
    build:
      context: .
      dockerfile: docker/ml.Dockerfile
    container_name: corrosion_ml
    restart: unless-stopped
    expose:
      - "8001"
    volumes:
      - ./dataset/processed/kt3/unet.pt:/models/unet.pt:ro
      - app_data:/app/data
    environment:
      - MODEL_PATH=${MODEL_PATH:-/models/unet.pt}
      - DATA_DIR=${DATA_DIR:-/app/data}
      - MM_PER_PX=${MM_PER_PX:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; sys_exit = 0 if urllib.request.urlopen('http://127.0.0.1:8001/health').getcode() == 200 else 1; exit(sys_exit)\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: corrosion_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - app_data:/app/data
    environment:
      - DATABASE_URL=${DATABASE_URL:?Переменная DATABASE_URL должна быть установлена в .env}
      - ML_SERVICE_URL=http://ml:8001
      - DATA_DIR=${DATA_DIR:-/app/data}
      - MM_PER_PX=${MM_PER_PX:-}
      - RETENTION_DAYS=${RETENTION_DAYS:-30}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-32}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; sys_exit = 0 if urllib.request.urlopen('http://127.0.0.1:8000/health').getcode() == 200 else 1; exit(sys_exit)\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: corrosion_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  db_data:
  app_data:
